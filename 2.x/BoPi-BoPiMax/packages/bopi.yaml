  bopi_set_mode_script:
    alias: BoPi Set Mode script
    fields:
      new_mode:
        name: New mode
        required: true
        selector:
          number:
            min: 0
            max: 9
            step: 1
            mode: box
    sequence:
      - action: rest_command.bopi_set_mode
        data:
          new_mode: "{{ new_mode | int }}"
      - delay: "00:00:01"
      - action: homeassistant.update_entity
        data:
          entity_id: sensor.bopi_mode
          
automation:
  - alias: BoPi Set Filtration Mode From Dropdown
    id: bopi_set_filtration_mode_from_dropdown
    trigger:
      - platform: state
        entity_id: input_select.bopi_filtration_mode
    action:
      - action: script.bopi_set_mode_script
        data:
          new_mode: >
            {{ trigger.to_state.state.split(' - ')[0] | int }}