# Copiez de fichier dans son intégralité dans le dossier packages. Il suffit de changer l'IP de votre BoPi dans la ligne 5.   
input_text:
  bopi_ip:
    name: BoPi IP
    initial: "IP_DE_VOTRE_BOPI_ICI"
# Entrez ici l'adress IP de votre BoPi entre "".     
input_select:
  bopi_filtration_mode:
    name: BoPi Filtration Mode
    options:
      - "0 - Off"
      - "1 - Classique 1"
      - "2 - Classique 2"
      - "3 - Classique 3"
      - "4 - Absent"
      - "5 - Intensif"
      - "6 - Chauffage"
      - "7 - Thermorégulation"
      - "8 - Hivernage Actif"
      - "9 - Hors Gel"
    initial: "1 - Classique 1"
    
rest:
  - authentication: basic
    username: "admin"
    password: "password"
    scan_interval: 60
    resource_template: >
        http://{{ states('input_text.bopi_ip') }}:80/allsensorsv2
    method: GET
    sensor:
      
      - name: "BoPi Temp 1"
        value_template: "{{ value_json.temp1 | round(2) }}"
        unit_of_measurement: "°C"
        unique_id: bopi_temp1
      - name: "BoPi Temp 2"
        value_template: "{{ value_json.temp2 | round(2) }}"
        unit_of_measurement: "°C"
        unique_id: bopi_temp2
      - name: "BoPi Box Temperature"
        value_template: "{{ value_json.boxtemp | round(2) }}"
        unit_of_measurement: "°C"
        unique_id: bopi_boxtemp
      - name: "BoPi Box Humidity"
        value_template: "{{ value_json.boxhumidity | round(2) }}"
        unit_of_measurement: "%"
        unique_id: bopi_boxhumidity
      - name: "BoPi pH Value"
        value_template: '{{ value_json.phvalue | round(2) }}'
        unique_id: bopi_phvalue
        unit_of_measurement: ""
      - name: "BoPi Redox Value"
        value_template: "{{ value_json.redoxvalue }}"
        unit_of_measurement: "mV"
        unique_id: bopi_redoxvalue  
      - name: "BoPi Last pH Injection"
        value_template: "{{ value_json.lphi }}"
        unique_id: bopi_lphi  
      - name: "BoPi Total pH Injection duration"
        value_template: "{{ value_json.tphi }}"
        unique_id: bopi_tphi
        unit_of_measurement: "s"
      - name: "BoPi Last Redox Injection"
        value_template: "{{ value_json.lorpi }}"
        unique_id: bopi_lorpi  
      - name: "BoPi Total Redox Injection duration"
        value_template: "{{ value_json.torpi }}"
        unique_id: bopi_torpi
        unit_of_measurement: "s"
      - name: "BoPi Current Mode"
        value_template: "{{ value_json.mode }}"
        unique_id: bopi_mode
      - name: "BoPi Uptime"
        value_template: "{{ value_json.uptime }}"
        unique_id: bopi_uptime
        unit_of_measurement: "s"
      - name: "BoPi Pool Pump Status"
        value_template: "{{ value_json.poolPump.status }}"
        unique_id: bopi_poolpump_status
      - name: "BoPi Pool Pump Override"
        value_template: "{{ value_json.poolPump.override }}"
        unique_id: bopi_poolpump_override
      - name: "BoPi Pool Pump Timeleft"
        value_template: "{{ value_json.poolPump.timeleft }}"
        unique_id: bopi_poolpump_timeleft
        unit_of_measurement: "s"
      - name: "BoPi Pool Lights Status"
        value_template: "{{ value_json.poolLights.status }}"
        unique_id: bopi_poollights_status
      - name: "BoPi Pool Lights Timeleft"
        value_template: "{{ value_json.poolLights.timeleft }}"
        unique_id: bopi_poollights_timeleft
        unit_of_measurement: "s"
      - name: "BoPi Relay 1 Status"
        value_template: "{{ value_json.relay1.status }}"
        unique_id: bopi_relay1_status
      - name: "BoPi Relay 1 Override"
        value_template: "{{ value_json.relay1.override }}"
        unique_id: bopi_relay1_override
      - name: "BoPi Relay 1 Timeleft"
        value_template: "{{ value_json.relay1.timeleft }}"
        unique_id: bopi_relay1_timeleft
        unit_of_measurement: "s"
      - name: "BoPi Relay 1 Role"
        value_template: "{{ value_json.relay1.role }}"
        unique_id: bopi_relay1_role
      - name: "BoPi Relay 2 Status"
        value_template: "{{ value_json.relay2.status }}"
        unique_id: bopi_relay2_status
      - name: "BoPi Relay 2 Override"
        value_template: "{{ value_json.relay2.override }}"
        unique_id: bopi_relay2_override
      - name: "BoPi Relay 2 Timeleft"
        value_template: "{{ value_json.relay2.timeleft }}"
        unique_id: bopi_relay2_timeleft
        unit_of_measurement: "s"
      - name: "BoPi Relay 2 Role"
        value_template: "{{ value_json.relay2.role }}"
        unique_id: bopi_relay2_role
      - name: "BoPi Relay 3 Status"
        value_template: "{{ value_json.relay3.status }}"
        unique_id: bopi_relay3_status
      - name: "BoPi Relay 3 Override"
        value_template: "{{ value_json.relay3.override }}"
        unique_id: bopi_relay3_override
      - name: "BoPi Relay 3 Timeleft"
        value_template: "{{ value_json.relay3.timeleft }}"
        unique_id: bopi_relay3_timeleft
        unit_of_measurement: "s"
      - name: "BoPi Relay 3 Role"
        value_template: "{{ value_json.relay3.role }}"
        unique_id: bopi_relay3_role
      - name: "BoPi Relay 4 Status"
        value_template: "{{ value_json.relay4.status }}"
        unique_id: bopi_relay4_status
      - name: "BoPi Relay 4 Override"
        value_template: "{{ value_json.relay4.override }}"
        unique_id: bopi_relay4_override
      - name: "BoPi Relay 4 Timeleft"
        value_template: "{{ value_json.relay4.timeleft }}"
        unique_id: bopi_relay4_timeleft
        unit_of_measurement: "s"
      - name: "BoPi Relay 4 Role"
        value_template: "{{ value_json.relay4.role }}"
        unique_id: bopi_relay4_role
rest_command:
  bopi_pump_on:
    url: >
        http://{{ states('input_text.bopi_ip') }}:80/poolpump
    method: POST
    content_type:  'application/json; charset=utf-8'
    payload: '{"overrideto":1, "deadline":8}'
  bopi_pump_off:
    url: >
        http://{{ states('input_text.bopi_ip') }}:80/poolpump
    method: POST
    content_type:  'application/json; charset=utf-8'
    payload: '{"overrideto":2, "deadline":8}'
  bopi_pump_reset_override:
    url: >
        http://{{ states('input_text.bopi_ip') }}:80/poolpump
    method: POST
    content_type:  'application/json; charset=utf-8'
    payload: '{"overrideto":0, "deadline":0}'
  bopi_lights_on:
    url: >
        http://{{ states('input_text.bopi_ip') }}:80/poollights
    method: POST
    content_type:  'application/json; charset=utf-8'
    payload: '{"newstatus":1, "deadline":8}'
  bopi_lights_off:
    url: >
        http://{{ states('input_text.bopi_ip') }}/poollights
    method: POST
    content_type:  'application/json; charset=utf-8'
    payload: '{"newstatus":0, "deadline":0}'  
  bopi_relay1_on:
    url: >
        http://{{ states('input_text.bopi_ip') }}:80/setrelay
    method: POST
    content_type:  'application/json; charset=utf-8'
    payload: '{"relay":1,"overrideto":1, "deadline":8}'
  bopi_relay1_off:
    url: >
        http://{{ states('input_text.bopi_ip') }}:80/setrelay
    method: POST
    content_type:  'application/json; charset=utf-8'
    payload: '{"relay":1,"overrideto":2, "deadline":8}'
  bopi_relay1_reset_override:
    url: >
        http://{{ states('input_text.bopi_ip') }}:80/setrelay
    method: POST
    content_type:  'application/json; charset=utf-8'
    payload: '{"relay":1,"overrideto":0, "deadline":0}'
  bopi_relay2_on:
    url: >
        http://{{ states('input_text.bopi_ip') }}:80/setrelay
    method: POST
    content_type:  'application/json; charset=utf-8'
    payload: '{"relay":2,"overrideto":1, "deadline":8}'
  bopi_relay2_off:
    url: >
        http://{{ states('input_text.bopi_ip') }}:80/setrelay
    method: POST
    content_type:  'application/json; charset=utf-8'
    payload: '{"relay":2,"overrideto":2, "deadline":8}'
  bopi_relay2_reset_override:
    url: >
        http://{{ states('input_text.bopi_ip') }}:80/setrelay
    method: POST
    content_type:  'application/json; charset=utf-8'
    payload: '{"relay":2,"overrideto":0, "deadline":0}'
  bopi_relay3_on:
    url: >
        http://{{ states('input_text.bopi_ip') }}:80/setrelay
    method: POST
    content_type:  'application/json; charset=utf-8'
    payload: '{"relay":3,"overrideto":1, "deadline":8}'
  bopi_relay3_off:
    url: >
        http://{{ states('input_text.bopi_ip') }}:80/setrelay
    method: POST
    content_type:  'application/json; charset=utf-8'
    payload: '{"relay":3,"overrideto":2, "deadline":8}'
  bopi_relay3_reset_override:
    url: >
        http://{{ states('input_text.bopi_ip') }}:80/setrelay
    method: POST
    content_type:  'application/json; charset=utf-8'
    payload: '{"relay":3,"overrideto":0, "deadline":0}'
  bopi_relay4_on:
    url: >
        http://{{ states('input_text.bopi_ip') }}:80/setrelay
    method: POST
    content_type:  'application/json; charset=utf-8'
    payload: '{"relay":4,"overrideto":1, "deadline":8}'
  bopi_relay4_off:
    url: >
        http://{{ states('input_text.bopi_ip') }}:80/setrelay
    method: POST
    content_type:  'application/json; charset=utf-8'
    payload: '{"relay":4,"overrideto":2, "deadline":8}'
  bopi_relay4_reset_override:
    url: >
        http://{{ states('input_text.bopi_ip') }}:80/setrelay
    method: POST
    content_type:  'application/json; charset=utf-8'
    payload: '{"relay":4,"overrideto":0, "deadline":0}'
  bopi_set_mode:
    url: >
      http://{{ states('input_text.bopi_ip') }}:80/setmode
    method: POST
    content_type: "application/json"
    payload: >
      {{ {"newMode": new_mode | int} | tojson }}
      
script:
  bopi_turn_pump_on_script:
    alias: BoPi Pump On Script
    sequence:
    - sequence:
      - action: rest_command.bopi_pump_on
        metadata: {}
        data: {}
      - action: homeassistant.update_entity
        metadata: {}
        data:
          entity_id:
          - sensor.bopi_pool_pump_override
          - sensor.bopi_pool_pump_status
          - sensor.bopi_pool_pump_timeleft
    description: ''
  bopi_turn_pump_off_script:
    alias: BoPi Pump Off Script
    sequence:
